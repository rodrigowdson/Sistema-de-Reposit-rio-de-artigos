# Perfil opcional para desenvolvimento offline (H2 em modo MySQL + disco local)
# Ative com: mvn spring-boot:run -Dspring-boot.run.profiles=local

spring:
  datasource:
    url: jdbc:h2:mem:repositorio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  storage:
    tipo: local
    local-dir: storage

logging:
  level:
    org.hibernate.SQL: debug
