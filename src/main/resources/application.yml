server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sistema-repositorio-artigos

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:repositorio_tcc}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
    username: ${DB_USERNAME:repositorio}
    password: ${DB_PASSWORD:repositorio_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: RepositorioHikariPool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:110MB}

app:
  storage:
    tipo: ${STORAGE_TYPE:local}
    # Na EC2, aponte para um diretório persistente fora da pasta do JAR (ex: /var/lib/repositorio-tcc/storage)
    local-dir: ${STORAGE_LOCAL_DIR:storage}
  backup:
    habilitado: ${BACKUP_ENABLED:false}
    intervalo-minutos: ${BACKUP_INTERVAL_MINUTES:60}
    ec2-user: ${BACKUP_EC2_USER:admin}
    ec2-host: ${BACKUP_EC2_HOST:}
    ec2-key: ${BACKUP_EC2_KEY:}
    ec2-dir: ${BACKUP_EC2_DIR:/home/admin/backup-repositorio}
    timeout-segundos: ${BACKUP_TIMEOUT_SECONDS:300}
  security:
    jwt:
      secret: ${JWT_SECRET:troque-esta-chave-jwt-em-producao-por-uma-string-longa-e-aleatoria}
      expiracao-horas: ${JWT_EXPIRATION_HOURS:24}
    admin-inicial:
      nome: ${APP_ADMIN_NOME:Administrador}
      email: ${APP_ADMIN_EMAIL:admin@repositorio.local}
      senha: ${APP_ADMIN_PASSWORD:admin123}

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL:info}
